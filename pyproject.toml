[project]
name = "pufferlib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kamdh", email = "kamerondeckerharris@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.0.1",
  "torchvision",
]
cuda = [
  "torch>=2.0.1",
  "torchvision",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda"},
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda" },
]
modul8 = { path = "../modul8", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
pufferlib = "pufferlib:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
